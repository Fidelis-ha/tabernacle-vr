<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1a2e" />
    <title>Stiftshütte VR — 3D Bibel-Erlebnis</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
      body { font-family: 'Segoe UI', system-ui, sans-serif; }
      
      #loading-screen {
        position: fixed; inset: 0; z-index: 1000;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #e8d5b7; transition: opacity 0.8s ease;
      }
      #loading-screen h1 { font-size: 2rem; margin-bottom: 0.5rem; letter-spacing: 0.15em; }
      #loading-screen p { font-size: 1rem; opacity: 0.7; margin-bottom: 2rem; }
      .progress-bar { width: 300px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
      .progress-bar div { height: 100%; background: linear-gradient(90deg, #c9a84c, #e8d5b7); width: 0%; transition: width 0.4s ease; }
      
      #error-screen {
        display: none; position: fixed; inset: 0; z-index: 1001;
        background: #1a1a2e; color: #ff6b6b; padding: 2rem;
        flex-direction: column; align-items: center; justify-content: center;
      }
      #error-screen h2 { margin-bottom: 1rem; }
      #error-screen pre { max-width: 800px; overflow: auto; font-size: 0.8rem; text-align: left; }
      
      #desktop-notice {
        display: none; position: fixed; inset: 0; z-index: 999;
        background: rgba(0,0,0,0.85); color: #e8d5b7;
        flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem;
      }
      #desktop-notice h2 { font-size: 1.5rem; margin-bottom: 1rem; }
      #desktop-notice p { max-width: 500px; line-height: 1.6; opacity: 0.8; }
      #desktop-notice .btn {
        margin-top: 1.5rem; padding: 0.75rem 2rem;
        background: #c9a84c; color: #1a1a2e; border: none; border-radius: 4px;
        font-size: 1rem; cursor: pointer; font-weight: 600;
      }
      #desktop-notice .btn:hover { background: #e8d5b7; }
      
      #webxr-button { display: none; }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <h1>⛪ StIFTSHÜTTE VR</h1>
      <p>Wird geladen…</p>
      <div class="progress-bar"><div id="progress"></div></div>
    </div>
    
    <div id="error-screen">
      <h2>⚠️ Fehler</h2>
      <pre id="error-output"></pre>
    </div>
    
    <div id="desktop-notice">
      <h2>VR-Brille erforderlich</h2>
      <p>Diese Anwendung ist für Meta Quest optimiert. Bitte öffne diese Seite in deiner VR-Brille über den Meta Quest Browser.</p>
      <p style="margin-top:1rem; font-size:0.9rem; opacity:0.5;">Du kannst die 3D-Vorschau mit der Maus auf dem Desktop erkunden.</p>
      <button class="btn" onclick="this.parentElement.style.display='none'">Trotzdem Desktop-Vorschau</button>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
