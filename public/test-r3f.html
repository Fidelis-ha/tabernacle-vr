<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test R3F</title>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "three": "https://esm.sh/three@0.160.0",
      "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.0",
      "@react-three/drei": "https://esm.sh/@react-three/drei@9.88.0"
    }
  }
  </script>
</head>
<body>
<div id="root"></div>
<script type="module">
import React, { useState, useEffect, Suspense } from 'react';
import { createRoot } from 'react-dom/client';
import { Canvas, useFrame } from '@react-three/fiber';
import * as THREE from 'three';

function SimpleScene() {
  const meshRef = React.useRef();
  
  useFrame((state) => {
    if (meshRef.current) {
      meshRef.current.rotation.y += 0.01;
    }
  });
  
  return React.createElement('group', null,
    React.createElement('ambientLight', { intensity: 1.5, color: 0xffffff }),
    React.createElement('directionalLight', { position: [0, 20, 0], intensity: 2, color: 0xffffff }),
    React.createElement('pointLight', { position: [0, 3, 6], intensity: 5, color: 0xffffff, distance: 30 }),
    React.createElement('mesh', { ref: meshRef, position: [0, 2, 4], castShadow: true },
      React.createElement('sphereGeometry', { args: [3, 32, 32] }),
      React.createElement('meshStandardMaterial', { color: 0xffff00, emissive: 0xffff00, emissiveIntensity: 0.5 })
    ),
    React.createElement('mesh', { position: [-4, 2, 0], castShadow: true },
      React.createElement('boxGeometry', { args: [2, 2, 2] }),
      React.createElement('meshStandardMaterial', { color: 0xff4444 })
    ),
    React.createElement('mesh', { rotation: [-Math.PI/2, 0, 0], position: [0, 0, 6], receiveShadow: true },
      React.createElement('planeGeometry', { args: [40, 40] }),
      React.createElement('meshStandardMaterial', { color: 0x00ff00 })
    )
  );
}

function App() {
  const [isLoading, setIsLoading] = useState(true);
  const [loadProgress, setLoadProgress] = useState(0);
  const [loadMessage, setLoadMessage] = useState('Initialisiere…');

  useEffect(() => {
    console.log('[Tabernacle VR] Starting application...');
    
    const stages = [
      { progress: 10, msg: 'Lade Three.js…' },
      { progress: 30, msg: 'Baue Stiftshütte…' },
      { progress: 60, msg: 'Berechne Materialien…' },
      { progress: 80, msg: 'Setze Beleuchtung…' },
      { progress: 95, msg: 'Finalisiere…' },
      { progress: 100, msg: 'Fertig!' },
    ];

    let stageIndex = 0;
    const interval = setInterval(() => {
      if (stageIndex < stages.length) {
        setLoadProgress(stages[stageIndex].progress);
        setLoadMessage(stages[stageIndex].msg);
        stageIndex++;
      }
    }, 350);

    const timeout = setTimeout(() => {
      clearInterval(interval);
      setIsLoading(false);
      console.log('[Tabernacle VR] Loading complete');
    }, 2100);

    return () => {
      clearInterval(interval);
      clearTimeout(timeout);
    };
  }, []);

  return React.createElement('div', { 
    style: { width: '100vw', height: '100vh', position: 'relative', background: '#0f0f1a' }
  },
    isLoading && React.createElement('div', {
      style: {
        position: 'absolute', inset: 0, zIndex: 1000,
        background: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)',
        display: 'flex', flexDirection: 'column',
        alignItems: 'center', justifyContent: 'center',
        color: '#e8d5b7'
      }
    },
      React.createElement('h1', { style: { fontSize: '2rem', marginBottom: '0.5rem' }}, '⛪ STIFTSHÜTTE VR'),
      React.createElement('p', { style: { fontSize: '1rem', opacity: 0.7, marginBottom: '2rem' }}, loadMessage),
      React.createElement('div', { style: { width: '300px', height: '4px', background: 'rgba(255,255,255,0.1)', borderRadius: '2px', overflow: 'hidden' }},
        React.createElement('div', { style: { height: '100%', background: 'linear-gradient(90deg, #c9a84c, #e8d5b7)', width: `${loadProgress}%`, transition: 'width 0.4s ease' }})
      )
    ),
    React.createElement(Canvas, {
      style: { width: '100%', height: '100%' },
      camera: { fov: 70, near: 0.1, far: 200, position: [0, 2, 8] },
      onCreated: ({ gl }) => {
        gl.setClearColor(0x111122);
        console.log('[Tabernacle VR] Canvas ready, size:', gl.domElement.width, 'x', gl.domElement.height);
      }
    },
      React.createElement(Suspense, { fallback: null },
        React.createElement(SimpleScene)
      )
    )
  );
}

console.log('[Tabernacle VR] Creating React root...');
const root = createRoot(document.getElementById('root'));
console.log('[Tabernacle VR] Root element found, mounting React...');
root.render(React.createElement(App));
console.log('[Tabernacle VR] React mounted successfully');
</script>
</body>
</html>
